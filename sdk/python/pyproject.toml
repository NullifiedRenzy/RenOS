[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "renos-sdk"
version = "1.0.0"
description = "RenOS API Python SDK"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "websockets>=12.0",
    "pydantic>=2.5.0",
]
readme = "README.md"
license = { text = "MIT" }
