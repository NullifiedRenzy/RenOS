[package]
name = "renos-sdk"
version = "1.0.0"
description = "RenOS API Rust SDK"
edition = "2021"

[dependencies]
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"
url = "2.5"
thiserror = "2"
http = "1"
bytes = "1"
pin-project = "1"
