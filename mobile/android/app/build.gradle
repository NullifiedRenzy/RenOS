plugins {
    id "com.android.application"
}

def refName = System.getenv("GITHUB_REF_NAME") ?: "v1.0.0"
def versionNameValue = refName.replaceFirst("^v", "")
def versionParts = versionNameValue.tokenize(".").collect { it.isInteger() ? it.toInteger() : 0 }
def major = versionParts.size() > 0 ? versionParts[0] : 1
def minor = versionParts.size() > 1 ? versionParts[1] : 0
def patch = versionParts.size() > 2 ? versionParts[2] : 0
def versionCodeValue = (major * 10000) + (minor * 100) + patch

android {
    namespace "com.renos.mobile"
    compileSdk 35

    defaultConfig {
        applicationId "com.renos.mobile"
        minSdk 26
        targetSdk 35
        versionCode versionCodeValue
        versionName versionNameValue
    }
}
