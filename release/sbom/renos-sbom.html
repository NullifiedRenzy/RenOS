  .controls input { flex: 1; min-width: 200px; }
  .controls select { min-width: 140px; cursor: pointer; }
  table { width: 100%; max-width: 1200px; margin: 0 auto; border-collapse: collapse; border: 1px solid var(--border);

  tr:hover td { background: var(--tr-hover); }

  .type-library { background: var(--badge-lib); color: #1d4ed8; }

  .type-unknown { background: var(--badge-unk); color: #64748b; }
  .purl { font-family: 'SF Mono','Fira Code','Cascadia Code',monospace; font-size: 0.75rem; word-break: break-all; color: #64748b; }
  @media (prefers-color-scheme: dark) { .purl { color: #94a3b8; } }
  .no-match { text-align: center; padding: 40px; color: #64748b; font-size: 0.875rem; }
  @media (max-width: 768px) {
    body { padding: 12px; }
    .summary { gap: 8px; }
    .summary-item { padding: 8px 14px; min-width: 70px; }
    .summary-item .num { font-size: 1.125rem; }
    td, th { padding: 6px 8px; }
    .purl { font-size: 0.6875rem; }

var tbody = document.getElementById('tbody');
var searchInput = document.getElementById('search');
var typeFilter = document.getElementById('typeFilter');
var summaryEl = document.getElementById('summary');
document.getElementById('gen-date').textContent = new Date().toISOString();

function escapeHtml(s) {
  var d = document.createElement('div');
  d.appendChild(document.createTextNode(s));
  return d.innerHTML;
}

function typeClass(t) {
  var map = { library: 'type-library', application: 'type-application', framework: 'type-framework' };
  return map[t] || 'type-unknown';
}

function render() {
  var q = searchInput.value.toLowerCase().trim();
  var tf = typeFilter.value;

  var filtered = DATA;
  if (q) {
    filtered = filtered.filter(function(c) {
      return c.name.toLowerCase().indexOf(q) !== -1 ||
             c.version.toLowerCase().indexOf(q) !== -1 ||
             c.license.toLowerCase().indexOf(q) !== -1 ||
             c.purl.toLowerCase().indexOf(q) !== -1;
    });
  }
  if (tf) {
    filtered = filtered.filter(function(c) { return c.type === tf; });
  }

  var total = DATA.length;
  var matched = filtered.length;
  var types = {};
  DATA.forEach(function(c) { types[c.type] = (types[c.type] || 0) + 1; });

  var sumHtml = '<div class="summary-item"><div class="num">' + total + '</div><div class="label">Total Components</div></div>';
  sumHtml += '<div class="summary-item"><div class="num">' + matched + '</div><div class="label">Filtered</div></div>';
  Object.keys(types).sort().forEach(function(k) {
    sumHtml += '<div class="summary-item"><div class="num">' + types[k] + '</div><div class="label">' + k + '</div></div>';
  });
  summaryEl.innerHTML = sumHtml;

  if (filtered.length === 0) {
    tbody.innerHTML = '<tr><td colspan="5" class="no-match">No components match your filters.</td></tr>';
    return;
  }

  var html = '';
  for (var i = 0; i < filtered.length; i++) {
    var c = filtered[i];
    html += '<tr>';
    html += '<td><strong>' + escapeHtml(c.name) + '</strong></td>';
    html += '<td>' + escapeHtml(c.version) + '</td>';
    html += '<td><span class="type-badge ' + typeClass(c.type) + '">' + escapeHtml(c.type) + '</span></td>';
    html += '<td>' + escapeHtml(c.license) + '</td>';
    html += '<td class="purl">' + escapeHtml(c.purl) + '</td>';
    html += '</tr>';
  }
  tbody.innerHTML = html;
}

searchInput.addEventListener('input', render);
typeFilter.addEventListener('change', render);
render();
</script>
