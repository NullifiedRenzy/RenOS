name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  id-token: write

env:
  GO_VERSION: "1.23"
  RUST_VERSION: "1.80"
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}

jobs:
  release:
    name: Release ${{ github.ref_name }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ─── Build Images ──────────────────────────────────────────────────────

      - name: Build and push Core
        uses: docker/build-push-action@v6
        with:
          context: core
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/renos-core:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/renos-core:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Agent
        uses: docker/build-push-action@v6
        with:
          context: agent
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/renos-agent:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/renos-agent:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Hub
        uses: docker/build-push-action@v6
        with:
          context: hub
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/renos-hub:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/renos-hub:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ─── Release ────────────────────────────────────────────────────────────

      - name: Generate release notes
        id: release_notes
        uses: mikepenz/release-changelog-builder-action@v5
        with:
          configuration: ".github/changelog-config.json"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.release_notes.outputs.changelog }}
          generate_release_notes: true
