name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  id-token: write

env:
  GO_VERSION: "1.25"
  RUST_VERSION: "1.88"
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}

jobs:
  release:
    name: Release ${{ github.ref_name }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Extract version info
        id: version
        run: |
          echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          echo "COMMIT=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Normalize image owner
        id: image_owner
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ─── Build & Push Images ────────────────────────────────────────────────

      - name: Build and push Core
        uses: docker/build-push-action@v6
        with:
          context: core
          push: true
          build-args: |
            VERSION=${{ steps.version.outputs.VERSION }}
            COMMIT=${{ steps.version.outputs.COMMIT }}
            BUILD_TIME=${{ github.event.head_commit.timestamp }}
          tags: |
            ${{ env.REGISTRY }}/${{ steps.image_owner.outputs.owner }}/renos-core:latest
            ${{ env.REGISTRY }}/${{ steps.image_owner.outputs.owner }}/renos-core:${{ steps.version.outputs.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Agent
        uses: docker/build-push-action@v6
        with:
          context: .
          file: agent/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.image_owner.outputs.owner }}/renos-agent:latest
            ${{ env.REGISTRY }}/${{ steps.image_owner.outputs.owner }}/renos-agent:${{ steps.version.outputs.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Hub
        uses: docker/build-push-action@v6
        with:
          context: hub
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.image_owner.outputs.owner }}/renos-hub:latest
            ${{ env.REGISTRY }}/${{ steps.image_owner.outputs.owner }}/renos-hub:${{ steps.version.outputs.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ─── Release ────────────────────────────────────────────────────────────

      - name: Generate release notes
        id: release_notes
        uses: mikepenz/release-changelog-builder-action@v5
        with:
          configuration: ".github/changelog-config.json"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.release_notes.outputs.changelog }}
          generate_release_notes: true

  linux-artifacts:
    name: Linux release artifacts
    runs-on: ubuntu-latest
    needs: release

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Set up protoc
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          protoc --version

      - name: Build Linux bundle
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          COMMIT="$(git rev-parse --short HEAD)"
          BUILD_TIME="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          BUNDLE="renos-linux-x64"
          mkdir -p "dist/${BUNDLE}"

          (cd core && go build -trimpath -buildvcs=false \
            -ldflags "-s -w -X main.version=${VERSION} -X main.commit=${COMMIT} -X main.buildTime=${BUILD_TIME}" \
            -o "../dist/${BUNDLE}/renos-core" ./cmd/renos-core)

          (cd renctl && go build -trimpath -buildvcs=false \
            -ldflags "-s -w -X main.version=${VERSION} -X main.commit=${COMMIT} -X main.buildTime=${BUILD_TIME}" \
            -o "../dist/${BUNDLE}/renctl" .)

          (cd agent && cargo build --release --bin renos-agent)
          cp agent/target/release/renos-agent "dist/${BUNDLE}/renos-agent"
          cp installer/linux/install.sh "dist/${BUNDLE}/install.sh"
          cp installer/linux/one-command-install.sh "dist/${BUNDLE}/one-command-install.sh"
          cp installer/linux/README.release.md "dist/${BUNDLE}/README.md"
          cp docker-compose.prod.yml "dist/${BUNDLE}/docker-compose.prod.yml"
          cp .env.example "dist/${BUNDLE}/.env.example"

          tar -czf "dist/RenOS-Linux-x64.tar.gz" -C dist "${BUNDLE}"
          (cd dist && sha256sum "RenOS-Linux-x64.tar.gz" > "RenOS-Linux-x64.tar.gz.sha256")

      - name: Upload Linux assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/RenOS-Linux-x64.tar.gz
            dist/RenOS-Linux-x64.tar.gz.sha256

  windows-artifacts:
    name: Windows release artifacts
    runs-on: windows-latest
    needs: release

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Set up protoc
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          choco install protoc -y --no-progress
          protoc --version

      - name: Build Windows bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = $env:GITHUB_REF_NAME
          $commit = (git rev-parse --short HEAD).Trim()
          $buildTime = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          $bundle = "dist\renos-windows-x64"
          New-Item -ItemType Directory -Force -Path $bundle | Out-Null

          Push-Location agent
          cargo build --release --bin renos-agent
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
          Copy-Item "agent\target\release\renos-agent.exe" "$bundle\renos-agent.exe" -Force

          Push-Location renctl
          go build -trimpath -buildvcs=false -ldflags "-s -w -X main.version=$version -X main.commit=$commit -X main.buildTime=$buildTime" -o "..\dist\renos-windows-x64\renctl.exe" .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location

          Copy-Item "installer\windows\install.ps1" "$bundle\install.ps1" -Force
          Copy-Item "installer\windows\config.json" "$bundle\config.json" -Force
          Copy-Item "installer\windows\enrollment-wizard.ps1" "$bundle\enrollment-wizard.ps1" -Force
          Copy-Item "installer\windows\renos-agent-service.ps1" "$bundle\renos-agent-service.ps1" -Force
          Copy-Item "installer\windows\README.md" "$bundle\README.md" -Force

          Compress-Archive -Path "$bundle\*" -DestinationPath "dist\RenOS-Windows-x64.zip" -Force
          $hash = Get-FileHash "dist\RenOS-Windows-x64.zip" -Algorithm SHA256
          "$($hash.Hash.ToLowerInvariant())  RenOS-Windows-x64.zip" | Set-Content "dist\RenOS-Windows-x64.zip.sha256"

      - name: Upload Windows assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/RenOS-Windows-x64.zip
            dist/RenOS-Windows-x64.zip.sha256

  android-artifacts:
    name: Android release artifacts
    runs-on: ubuntu-latest
    needs: release

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build Android APK
        shell: bash
        run: |
          set -euo pipefail
          cd mobile/android
          gradle :app:assembleDebug --no-daemon
          mkdir -p ../../dist
          cp app/build/outputs/apk/debug/app-debug.apk ../../dist/RenOS-Android.apk
          cd ../../dist
          sha256sum RenOS-Android.apk > RenOS-Android.apk.sha256

      - name: Upload Android assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/RenOS-Android.apk
            dist/RenOS-Android.apk.sha256
