{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "renos.fullname" . }}
  namespace: {{ .Release.Namespace | default "renos" }}
  labels:
    {{- include "renos.labels" . | nindent 4 }}
    app.kubernetes.io/component: secrets
type: Opaque
data:
  {{- if .Values.secrets.autoGenerate }}
  jwt-secret: {{ .Values.secrets.jwtSecret | default (randAlphaNum 64) | b64enc | quote }}
  encryption-key: {{ .Values.secrets.encryptionKey | default (randAlphaNum 32) | b64enc | quote }}
  {{- else }}
  jwt-secret: {{ .Values.secrets.jwtSecret | required "jwtSecret is required when autoGenerate is false" | b64enc | quote }}
  encryption-key: {{ .Values.secrets.encryptionKey | required "encryptionKey is required when autoGenerate is false" | b64enc | quote }}
  {{- end }}
  {{- if and .Values.postgres.enabled (not .Values.postgres.auth.existingSecret) }}
  postgres-password: {{ .Values.postgres.auth.password | default (randAlphaNum 24) | b64enc | quote }}
  {{- end }}
  {{- if and .Values.redis.enabled .Values.redis.auth.enabled (not .Values.redis.auth.existingSecret) }}
  redis-password: {{ .Values.redis.auth.password | default (randAlphaNum 24) | b64enc | quote }}
  {{- end }}
{{- end }}
