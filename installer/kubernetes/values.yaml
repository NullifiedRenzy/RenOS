global:
  imageRegistry: ""
  imagePullSecrets: []
  imagePullPolicy: IfNotPresent

images:
  core:
    repository: renos/core
    tag: ""
  hub:
    repository: renos/hub
    tag: ""
  agent:
    repository: renos/agent
    tag: ""
  postgres:
    repository: postgres
    tag: 16-alpine
  redis:
    repository: redis
    tag: 7-alpine
  nats:
    repository: nats
    tag: 2-alpine

core:
  replicaCount: 2
  logLevel: info
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  env:
    NODE_ENV: production
    RENOS_LOG_FORMAT: json
  persistence:
    enabled: true
    size: 10Gi
    storageClass: ""
    accessMode: ReadWriteOnce
  service:
    type: ClusterIP
    port: 8080
    metricsPort: 9090
  ingress:
    enabled: false
    path: /api(/|$)(.*)
    pathType: ImplementationSpecific

hub:
  replicaCount: 2
  logLevel: info
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  env:
    NODE_ENV: production
    RENOS_LOG_FORMAT: json
  service:
    type: ClusterIP
    port: 3000
    metricsPort: 9091
  ingress:
    enabled: false
    path: /(.*)
    pathType: ImplementationSpecific

agent:
  logLevel: info
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi
  env:
    NODE_ENV: production
    RENOS_LOG_FORMAT: json
  tolerations:
    - operator: Exists
      effect: NoSchedule
    - operator: Exists
      effect: NoExecute
  nodeSelector: {}
  dockerSocketPath: /var/run/docker.sock

postgres:
  enabled: true
  storage: 10Gi
  storageClass: ""
  accessMode: ReadWriteOnce
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1
      memory: 1Gi
  auth:
    database: renos
    username: renos
    password: ""
    existingSecret: ""
  persistence:
    enabled: true
    size: 10Gi
    storageClass: ""
    accessMode: ReadWriteOnce
  service:
    port: 5432

redis:
  enabled: true
  storage: 5Gi
  storageClass: ""
  accessMode: ReadWriteOnce
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi
  auth:
    enabled: true
    password: ""
    existingSecret: ""
  persistence:
    enabled: true
    size: 5Gi
    storageClass: ""
    accessMode: ReadWriteOnce
  service:
    port: 6379

nats:
  enabled: true
  cluster:
    enabled: true
    replicas: 3
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  persistence:
    enabled: true
    size: 10Gi
    storageClass: ""
    accessMode: ReadWriteOnce
  service:
    clientPort: 4222
    clusterPort: 6222
    monitorPort: 8222

ingress:
  enabled: false
  className: ""
  annotations:
    kubernetes.io/ingress.class: nginx
  hosts:
    - host: renos.local
      paths:
        - path: /api
          pathType: Prefix
          service: core
          port: 8080
        - path: /
          pathType: Prefix
          service: hub
          port: 3000
  tls:
    - hosts:
        - renos.local
      secretName: renos-tls

secrets:
  existingSecret: ""
  autoGenerate: true
  jwtSecret: ""
  encryptionKey: ""

backup:
  enabled: false
  schedule: "0 2 * * *"
  storage:
    size: 20Gi
    storageClass: ""
    accessMode: ReadWriteOnce
  retention:
    days: 30
    copies: 14
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

monitoring:
  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    labels: {}
  prometheusRules:
    enabled: false
    labels: {}

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

networkPolicy:
  enabled: false
